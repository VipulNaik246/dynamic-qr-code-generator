<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        input[type="text"] {
            padding: 10px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        img {
            margin-top: 20px;
            max-width: 100%;
            border: 1px solid #ddd;
            padding: 10px;
            background: #fff;
        }
        .result {
            margin-top: 20px;
        }
        .scan-count {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>QR Code Generator</h2>
        <form method="POST">

            <input type="text" name="text" placeholder="Enter text or URL" required>
            <button type="submit">Generate QR</button>
        </form>
        
        {% if qr_image %}
        <div class="result">
            <h3>QR Code:</h3>
            <img src="{{ qr_image }}" id="qrImg">
            <p>Scan Count: <span class="scan-count" id="scanCount">{{ count }}</span></p>
        </div>
        {% endif %}
    </div>

<script>
    {% if qr_id %}
    const qrId = {{ qr_id | tojson }};
    const countSpan = document.getElementById("scanCount");
    
    setInterval(() => {
        fetch(`/count/${qrId}?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                if (countSpan) {
                    countSpan.textContent = data.count;
                }
            });
    }, 2000);
    {% endif %}
</script>

</body>
</html>
